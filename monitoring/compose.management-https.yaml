services:
  management-web:
    command:
      - uvicorn
      - management.web:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --no-proxy-headers
      - --ssl-certfile
      - /run/schutz-certs/management.crt
      - --ssl-keyfile
      - /run/schutz-certs/management.key
    ports: !override
      - "0.0.0.0:18001:8000"
    volumes:
      - /opt/schutz-monitoring/certs:/run/schutz-certs:ro
