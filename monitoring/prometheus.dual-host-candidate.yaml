# Candidate only; not used by the current release script.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: portal-otel
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: portal-health
    metrics_path: /api/v0/component/prometheus.exporter.blackbox.portal_check/metrics
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://10.20.10.62:8080/proxy-health]
        labels: {check: proxy}
      - targets: [http://10.20.10.62:8080/health]
        labels: {check: app}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: otel-collector:8889
  - job_name: portal-db-health
    metrics_path: /api/v0/component/prometheus.exporter.blackbox.portal_check/metrics
    params:
      module: [employee_read]
    static_configs:
      - targets: [http://10.20.10.62:8081/internal/check/employee]
        labels: {check: database}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: otel-collector:8889

  - job_name: ec2-node
    metrics_path: /api/v0/component/prometheus.exporter.unix.host/metrics
    static_configs:
      - targets: [10.20.10.62:9100]
        labels: {server_role: service, server_name: service-server}
      - targets: [monitoring-host-metrics:12345]
        labels: {server_role: monitoring, server_name: monitoring-server}
