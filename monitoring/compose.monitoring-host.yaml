# Run with --project-directory /opt/schutz-monitoring on the server.
# This overlay owns only monitoring-host-metrics; it never remounts Prometheus.
services:
  monitoring-host-metrics:
    image: grafana/alloy:v1.9.1
    pid: host
    command:
    - run
    - --storage.path=/var/lib/alloy/data
    - --server.http.listen-addr=0.0.0.0:12345
    - /etc/alloy/config.alloy
    volumes:
    - ./monitoring/alloy.monitoring-host.alloy:/etc/alloy/config.alloy:ro
    - /:/host:ro,rslave
    - monitoring-host-data:/var/lib/alloy/data
    restart: unless-stopped
volumes:
  monitoring-host-data: null
networks:
  default:
    external: true
    name: schutz-monitoring_default
